name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a run that may already be deploying production. The deploy
# job has its own non-canceling production lock below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  notify-parent:
    name: Update the parent submodule reference
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch the successful main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_REPOSITORY_TOKEN: ${{ secrets.PARENT_REPOSITORY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" | jq --raw-output '.object.sha')
          if [ "$SHA" != "$latest_main_sha" ]; then
            echo "${SHA} is no longer the tip of main; skipping parent update."
            exit 0
          fi

          if [ -z "$PARENT_REPOSITORY_TOKEN" ]; then
            echo "::warning::PARENT_REPOSITORY_TOKEN is not configured; skipping the parent submodule update."
            echo "Add a fine-grained token or GitHub App token with Contents: write access to Anabuki-AI/anabuki-event as this repository's Actions secret."
            exit 0
          fi

          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/Anabuki-AI/anabuki-event/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PARENT_REPOSITORY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"submodule-main-succeeded\",\"client_payload\":{\"repository\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${SHA}\"}}"

  deploy-production:
    name: Deploy Nuxt Worker with same-origin API proxy
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-frontend-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUXT_BACKEND_BASE_URL: https://api.anabuki-event.com
      NUXT_PUBLIC_API_BASE: /api
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Guard against deploying an old main commit
        id: main_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main_sha=$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" | jq --raw-output '.object.sha')
          if [ "$EXPECTED_SHA" = "$latest_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "${EXPECTED_SHA} is no longer the tip of main; skipping deployment."
          fi
      - name: Validate Cloudflare deployment credentials
        if: steps.main_guard.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
      - name: Install dependencies
        if: steps.main_guard.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build Nuxt Worker with private tunnel upstream
        if: steps.main_guard.outputs.current == 'true'
        run: pnpm build
      - name: Deploy Worker
        if: steps.main_guard.outputs.current == 'true'
        run: pnpm exec wrangler deploy --config wrangler.jsonc
